quarkus.datasource.jdbc.url=${JDBC_URL}
quarkus.datasource.db-kind=${DB_KIND}
quarkus.datasource.username=${DB_USERNAME}
quarkus.datasource.password=${DB_PASSWORD}

quarkus.http.port=${HTTP_PORT:8080}
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=${FRONTEND_ORIGIN}
# Recipe images travel inside the recipe JSON as base64 data URLs.
quarkus.http.limits.max-body-size=10M

# Swagger UI is on by default under the dev profile and is deliberately not forced into the
# production build; disabling the spec there drops /openapi as well. nginx proxies /api/ to the
# backend root, so /docs here is /api/docs/ from outside.
quarkus.swagger-ui.path=/docs
%prod.quarkus.smallrye-openapi.enable=false

# A native image embeds only the resources it is told to. users.json is read from the classpath
# at runtime, so without this it is simply absent from the production binary.
quarkus.native.resources.includes=users.json
# Recipes are sorted with a Slovak collator, and a native image only carries the locales it is
# built with.
quarkus.locales=en,sk
