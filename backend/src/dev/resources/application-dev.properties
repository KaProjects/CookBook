# Development overrides, activated by the Maven "dev" profile (backend/build_dev.sh).
#
# Nothing here reaches production: src/dev/resources is only added to the
# classpath by the "dev" profile, and Quarkus loads application-dev.properties
# only while the dev profile is active.

quarkus.http.port=9092
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=http://localhost:3002

# In-memory H2 in MySQL mode, built and seeded once on every start by DevDataInitializer.
#
# There is deliberately no INIT clause: H2 runs it on every connection it opens, and the table
# script drops every table, so each new pooled connection emptied the database. DB_CLOSE_DELAY=-1
# keeps the database for as long as the application runs - without it H2 discards an in-memory
# database when its last connection closes, which the pool does to idle connections.
quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:mem:default;DB_CLOSE_DELAY=-1;MODE=MySQL
quarkus.datasource.jdbc.driver=org.h2.Driver
quarkus.datasource.username=sa
quarkus.datasource.password=

# Throwaway users matching the sample recipes, so the real git-crypt encrypted users.json is
# never needed to run the application locally. The name has to be configured rather than relying
# on classpath order: the dev Maven profile lists src/main/resources first, so a file called
# users.json here would lose to the real one.
users.resource=dev-users.json

# The image column is a LONGBLOB holding a base64 data URL, which Hibernate maps as text. It has
# always worked, and changing the column would mean migrating the production data, so the
# dev-mode schema check that reports the mismatch on every start is switched off.
quarkus.hibernate-orm.validate-in-dev-mode=false
